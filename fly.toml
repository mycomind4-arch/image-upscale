app = "image-upscale-lab"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

[http_service.concurrency]
  type = "requests"
  hard_limit = 2
  soft_limit = 1

[[vm]]
  cpu_kind = "shared"
  cpus = 2
  memory = "4gb"
