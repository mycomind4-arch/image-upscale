<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Image Upscale Lab</title><style>body{font-family:system-ui;margin:40px;max-width:1000px}button{padding:12px 18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}img{max-width:100%;border:1px solid #ddd}.drop{padding:50px;border:2px dashed #999;text-align:center}</style></head><body><h1>Image Upscale Lab</h1><p>Private AI restoration and super-resolution workspace.</p><div class="drop"><input id="file" type="file" accept="image/*"><button onclick="run()">Enhance</button></div><p id="status"></p><div class="grid"><section><h3>Original</h3><img id="before"></section><section><h3>Enhanced</h3><img id="after"></section></div><script>const f=document.getElementById('file');f.onchange=()=>document.getElementById('before').src=URL.createObjectURL(f.files[0]);async function run(){if(!f.files[0])return;document.getElementById('status').textContent='Processing...';const fd=new FormData();fd.append('file',f.files[0]);const r=await fetch('/enhance?mode=auto&scale=4&fidelity=.75',{method:'POST',body:fd});if(!r.ok){document.getElementById('status').textContent=await r.text();return}document.getElementById('after').src=URL.createObjectURL(await r.blob());document.getElementById('status').textContent='Done';}</script></body></html>
